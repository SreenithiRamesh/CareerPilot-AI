name: careerpilot-ai

services:
  mysql:
    image: mysql:8.4
    container_name: careerpilot-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: careerpilot_ai
      MYSQL_USER: careerpilot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: careerpilot-minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    container_name: careerpilot-minio-init
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_RESUME_BUCKET: ${S3_RESUME_BUCKET}

    entrypoint: /bin/sh

    command:
      - -c
      - |
        mc alias set local \
          http://minio:9000 \
          "$${MINIO_ROOT_USER}" \
          "$${MINIO_ROOT_PASSWORD}"

        mc mb \
          --ignore-existing \
          --with-versioning \
          "local/$${S3_RESUME_BUCKET}"

        mc anonymous set none \
          "local/$${S3_RESUME_BUCKET}"

  backend:
    container_name: careerpilot-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_ENV: docker

      DATABASE_URL: mysql+pymysql://careerpilot:${MYSQL_PASSWORD}@mysql:3306/careerpilot_ai
      LANGGRAPH_DATABASE_URL: mysql://careerpilot:${MYSQL_PASSWORD}@mysql:3306/careerpilot_ai

      GEMINI_API_KEY: ${GEMINI_API_KEY}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_RESUME_BUCKET: ${S3_RESUME_BUCKET:-careerpilot-resumes}

    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/app/chroma_db

    depends_on:
      mysql:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_data:
  chroma_data:
  minio_data:
