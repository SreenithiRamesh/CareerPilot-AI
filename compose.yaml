name: careerpilot-ai

services:
  mysql:
    image: mysql:8.4
    container_name: careerpilot-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: careerpilot_ai
      MYSQL_USER: careerpilot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    container_name: careerpilot-backend
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_ENV: docker

      DATABASE_URL: mysql+pymysql://careerpilot:${MYSQL_PASSWORD}@mysql:3306/careerpilot_ai
      LANGGRAPH_DATABASE_URL: mysql://careerpilot:${MYSQL_PASSWORD}@mysql:3306/careerpilot_ai

      GEMINI_API_KEY: ${GEMINI_API_KEY}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_RESUME_BUCKET: ${S3_RESUME_BUCKET:-}

    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/app/chroma_db

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
  chroma_data: