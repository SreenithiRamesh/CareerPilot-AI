name: CareerPilot Quality Gates

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: careerpilot_ai
          MYSQL_USER: careerpilot
          MYSQL_PASSWORD: careerpilot_ci_password
          MYSQL_ROOT_PASSWORD: careerpilot_ci_root_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot
          -pcareerpilot_ci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://careerpilot:careerpilot_ci_password@127.0.0.1:3306/careerpilot_ai
      LANGGRAPH_DATABASE_URL: mysql://careerpilot:careerpilot_ci_password@127.0.0.1:3306/careerpilot_ai
      GEMINI_API_KEY: test_gemini_api_key_not_used_for_network_calls
      JWT_SECRET_KEY: careerpilot_ci_jwt_secret_64_characters_long_for_tests_only
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: careerpilot_ci_access_key
      AWS_SECRET_ACCESS_KEY: careerpilot_ci_secret_key
      S3_RESUME_BUCKET: careerpilot-ci-resumes

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify migration state
        run: alembic check

      - name: Run backend tests
        run: python -m pytest -q

  frontend-quality:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid
        run: npm run build

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare safe Docker environment
        run: cp .env.docker.example .env.docker

      - name: Validate Compose configuration
        run: >-
          docker compose
          --env-file .env.docker
          config
          --quiet

      - name: Run Dockerfile BuildKit checks
        run: docker build --check backend

      - name: Build backend image
        run: >-
          docker build
          --tag careerpilot-backend-ci
          backend
