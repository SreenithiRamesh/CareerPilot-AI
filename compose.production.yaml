name: careerpilot-production

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: careerpilot_ai
      MYSQL_USER: careerpilot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_production_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    security_opt:
      - no-new-privileges:true


  minio:
    image: minio/minio:latest
    restart: unless-stopped

    command:
      - server
      - /data

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_production_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    security_opt:
      - no-new-privileges:true


  minio-init:
    image: minio/mc:latest
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_RESUME_BUCKET: ${S3_RESUME_BUCKET}

    entrypoint: /bin/sh

    command:
      - -c
      - |
        mc alias set local \
          http://minio:9000 \
          "$${MINIO_ROOT_USER}" \
          "$${MINIO_ROOT_PASSWORD}"

        mc mb \
          --ignore-existing \
          --with-versioning \
          "local/$${S3_RESUME_BUCKET}"

        mc anonymous set none \
          "local/$${S3_RESUME_BUCKET}"

    security_opt:
      - no-new-privileges:true


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DATABASE_URL: mysql+pymysql://careerpilot:${MYSQL_PASSWORD}@mysql:3306/careerpilot_ai
      LANGGRAPH_DATABASE_URL: mysql://careerpilot:${MYSQL_PASSWORD}@mysql:3306/careerpilot_ai

      GEMINI_API_KEY: ${GEMINI_API_KEY}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      CORS_ORIGINS: ${CORS_ORIGINS}

      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

      S3_ENDPOINT_URL: http://minio:9000
      S3_RESUME_BUCKET: ${S3_RESUME_BUCKET}

    expose:
      - "8000"

    volumes:
      - chroma_production_data:/app/chroma_db

    depends_on:
      mysql:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_production_data:/data
      - caddy_production_config:/config

    depends_on:
      backend:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true
volumes:
  mysql_production_data:
  chroma_production_data:
  minio_production_data:
  caddy_production_data:
  caddy_production_config: